<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoliCord</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Écran de connexion -->
  <section id="login" class="login">
    <div class="login-card">
      <img src="logo.svg" alt="" class="login-logo">
      <h1 class="brand">LoliCord</h1>
      <p class="tagline">25時、LoliCordで。</p>
      <form id="login-form">
        <input id="login-name" maxlength="24" placeholder="Ton pseudo" autocomplete="off" required>
        <button type="submit">Se connecter</button>
      </form>
      <p id="login-error" class="error"></p>
    </div>
  </section>

  <!-- Application -->
  <main id="app" class="app hidden">
    <nav class="servers">
      <div class="server-icon active" title="LoliCord"><img src="logo.svg" alt="LoliCord"></div>
    </nav>

    <aside class="sidebar">
      <header class="server-name" id="server-name">LoliCord</header>
      <div class="channel-group">SALONS TEXTUELS</div>
      <ul id="text-channels" class="channels"></ul>
      <div class="channel-group">SALONS VOCAUX</div>
      <ul id="voice-channels" class="channels"></ul>
      <footer class="me">
        <span class="avatar small" id="me-avatar"></span>
        <span class="me-name" id="me-name"></span>
        <button id="mute-btn" class="icon-btn" title="Couper le micro">🎙</button>
      </footer>
    </aside>

    <section class="content">
      <header class="topbar">
        <span class="hash" id="topbar-icon">#</span>
        <span id="topbar-title"></span>
        <span class="clock" id="clock"></span>
      </header>

      <!-- Vue texte -->
      <div id="text-view" class="text-view">
        <div id="messages" class="messages"></div>
        <form id="message-form" class="composer">
          <input id="message-input" maxlength="2000" autocomplete="off">
          <button type="submit" title="Envoyer">➤</button>
        </form>
      </div>

      <!-- Vue appel vocal -->
      <div id="voice-view" class="voice-view hidden">
        <div id="call-grid" class="call-grid"></div>
        <div class="call-bar">
          <button id="call-mute" class="call-btn">🎙</button>
          <button id="call-toggle" class="call-btn join">Rejoindre</button>
        </div>
      </div>
    </section>

    <aside class="members">
      <div class="channel-group" id="members-title">EN LIGNE</div>
      <ul id="member-list"></ul>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
