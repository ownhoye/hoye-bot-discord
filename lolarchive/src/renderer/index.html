<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
    <title>LolArchive</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-icon" id="brand-icon"></span>
            <span class="brand-name">LolArchive</span>
        </div>
        <nav class="top-actions" id="top-actions"></nav>
    </header>
    <main id="view"></main>
    <div id="drop-overlay" class="drop-overlay" hidden>
        <div class="drop-card">
            <span class="drop-icon" id="drop-icon"></span>
            <div class="drop-title">Dépose tes fichiers ici</div>
            <div class="drop-sub">Une archive .lol / .xxx sera ouverte, le reste sera ajouté à une nouvelle archive.</div>
        </div>
    </div>
    <div id="modal-root"></div>
    <div id="toasts" class="toasts"></div>
    <script src="app.js"></script>
</body>
</html>
