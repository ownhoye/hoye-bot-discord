<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.35" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset="0.18" stop-color="#171717"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.12" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="textShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <path d="M110 190 Q60 190 60 240 L60 400 L960 400 L960 300 Q960 252 912 252 L480 252 Q455 252 440 232 L420 208 Q405 190 380 190 Z"
          fill="url(#back)" stroke="url(#rim)" stroke-width="5"/>
    <rect x="44" y="300" width="936" height="560" rx="54" fill="url(#front)" stroke="url(#rim)" stroke-width="6"/>
  </g>
  <text x="512" y="660" text-anchor="middle" font-family="Inter Display, Inter, Arial Black, sans-serif" font-weight="900"
        font-size="214" letter-spacing="-6" fill="#ffffff" filter="url(#textShadow)"
        transform="translate(512 0) scale(0.9 1) translate(-512 0)">NO LEAK</text>
</svg>
