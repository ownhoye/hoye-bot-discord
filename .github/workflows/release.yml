name: Build & Release LoliCord

on:
  push:
    tags:
      - "v*"          # publie une release : git tag v1.0.0 && git push --tags
    branches:
      - main
      - "claude/**"   # build de test : l'installeur est téléchargeable dans l'onglet Actions
  workflow_dispatch:

permissions:
  contents: write    # nécessaire pour créer la GitHub Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Equicord renderer (standalone)
        run: pnpm buildStandalone

      - name: Package lolicord-dist.zip
        shell: pwsh
        run: |
          # lolicord-dist.zip — structure attendue par l'installeur (Program.cs EnsureDistAsync) :
          # la racine du zip = _distDir (%LOCALAPPDATA%\LoliCord\dist\)
          # => patcher.js DOIT être à la racine, pas dans un sous-dossier dist\desktop\
          $staging = "lolicord-dist-staging"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null

          # Fichiers JS compilés : on copie le CONTENU de dist\desktop\ à la racine du staging
          # (patcher.js, renderer.js, preload.js, etc. directement accessibles)
          if (Test-Path "dist\desktop") {
            Copy-Item "dist\desktop\*" "$staging\" -Recurse -Force
          } elseif (Test-Path "dist") {
            # Fallback : ancienne structure
            Copy-Item "dist\*" "$staging\" -Recurse -Force
          }

          # Ghost-server (voice/stream server)
          if (Test-Path "ghost-server") {
            Copy-Item "ghost-server" "$staging\ghost-server" -Recurse
          }

          # Static assets from release/lolicord-dist (ffmpeg.dll, modules, mac/, multi-instance-icons/, etc.)
          if (Test-Path "release\lolicord-dist") {
            Copy-Item "release\lolicord-dist\*" "$staging\" -Recurse -Force
          }

          # Entry-point files
          foreach ($f in @("lolicord-index.js", "lolicord-preload.js")) {
            if (Test-Path $f) { Copy-Item $f "$staging\" }
          }

          # Sanity-check : patcher.js doit être à la racine
          if (-not (Test-Path "$staging\patcher.js")) {
            Write-Error "BUILD ERROR: patcher.js absent de la racine du staging — l'installeur ne pourra pas fonctionner."
            exit 1
          }

          Compress-Archive -Path "$staging\*" -DestinationPath "lolicord-dist.zip" -Force

          # Mode standalone : le client télécharge releases/latest/download/LoliCord.asar
          Copy-Item "dist\lolicord.asar" "LoliCord.asar"
          Write-Host "lolicord-dist.zip created ($($(Get-Item lolicord-dist.zip).Length / 1MB) MB)"

      - name: Build LoliCord-Installer.exe
        working-directory: installer-src
        run: |
          npm install --legacy-peer-deps
          npm run compile
          npx electron-builder --win -p never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LoliCord-${{ github.sha }}
          path: |
            release/installer/LoliCord-Installer.exe
            lolicord-dist.zip
            dist/desktop.asar
            LoliCord.asar
          if-no-files-found: error

      - name: Upload lolicord-dist.zip to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lolicord-dist.zip
            dist/desktop.asar
            LoliCord.asar
            release/installer/LoliCord-Installer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
